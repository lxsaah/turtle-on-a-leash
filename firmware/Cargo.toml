[package]
name = "leash-firmware"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: MCU target and Embassy patches. The AimDB revision must
# match the one in the root Cargo.toml.
[workspace]

[features]
# A debugger write to `TEST_PRESS` acts as a button press, for scripted runs.
test-hooks = []

[dependencies]
aimdb-core = { git = "https://github.com/aimdb-dev/aimdb", rev = "3d04efb10b3e2b5a835fade6cc9f6c2a6bfa864b", default-features = false }
aimdb-embassy-adapter = { git = "https://github.com/aimdb-dev/aimdb", rev = "3d04efb10b3e2b5a835fade6cc9f6c2a6bfa864b", default-features = false, features = ["embassy-runtime", "defmt", "connector-io"] }
aimdb-serial-connector = { git = "https://github.com/aimdb-dev/aimdb", rev = "3d04efb10b3e2b5a835fade6cc9f6c2a6bfa864b", default-features = false, features = ["connector", "defmt"] }
contracts = { path = "../contracts" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", features = ["paint-stack"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h563zi", "memory-x", "time-driver-any", "unstable-pac", "exti"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768", "generic-queue-16"] }
embedded-alloc = { version = "0.6", features = ["llff"] }
leash = { path = "../leash" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1

[patch.crates-io]
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "03c826f2544220cb44b2dec05f5d636a80d39382" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy", rev = "03c826f2544220cb44b2dec05f5d636a80d39382" }
